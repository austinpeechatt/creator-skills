<!doctype html>
<html><head><meta charset="utf-8"><title>feature-list</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(97,141,226,0.18), transparent 55%),
      linear-gradient(135deg, #06101f 0%, #0a1830 60%, #0e2246 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 120px 120px;
    mask-image: radial-gradient(ellipse at 30% 50%, black 30%, transparent 80%);
  }
  .wrap {
    position: absolute; top: 50%; transform: translateY(-50%);
    left: 110px; width: 880px;
    display: flex; flex-direction: column; gap: 28px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-size: 20px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(181,208,244,0.95);
  }
  .eyebrow::before {
    content: ""; width: 60px; height: 2px; border-radius: 2px;
    background: var(--aw-gradient-primary);
  }
  .items { display: flex; flex-direction: column; gap: 22px; }
  .item {
    display: flex; align-items: baseline; gap: 22px;
    font-size: 72px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05;
    color: #f4f8ff;
    text-shadow: 0 2px 30px rgba(97,141,226,0.25);
    opacity: 0; transform: translateX(-24px);
    transition: opacity 450ms ease, transform 450ms cubic-bezier(.2,.7,.2,1);
  }
  .item.visible { opacity: 1; transform: translateX(0); }
  .check {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 72px; font-weight: 400;
    color: #9ec5ff;
    text-shadow: 0 0 20px rgba(97,141,226,0.55), 0 0 40px rgba(97,141,226,0.35);
  }
  .footer {
    position: absolute; left: 110px; bottom: 80px;
    font-size: 18px; color: rgba(181,208,244,0.55); letter-spacing: 0.12em; text-transform: uppercase;
  }
</style></head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div><div class="grid"></div>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="items" id="items"></div>
  </div>
  <div class="footer" id="footer"></div>
</div>
<script>
  window.__READY__ = false;
  window.addEventListener('load', async () => {
    const P = window.__PROPS__ || {};
    document.getElementById('eyebrow').textContent = P.eyebrow || '';
    document.getElementById('footer').textContent  = P.footer || '';
    const items = P.items || [];
    const box = document.getElementById('items');
    items.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      const text = (it.text || "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      d.innerHTML = `<span class="label">${text}</span><span class="check">&#10003;</span>`;
      box.appendChild(d);
      setTimeout(() => d.classList.add('visible'), it.appear_ms || (i * 700));
    });
    await document.fonts.ready;
    window.__READY__ = true;
  });
</script>
</body></html>
