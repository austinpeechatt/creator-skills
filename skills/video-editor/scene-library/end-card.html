<!doctype html>
<html><head><meta charset="utf-8"><title>end-card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  .bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 30%, rgba(97,141,226,0.32), transparent 55%),
                linear-gradient(135deg, #0a1428 0%, #11203f 60%, #163163 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse at center, black 35%, transparent 75%);
  }
  .wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px; color: var(--aw-text-light);
  }
  .logo-row {
    display: flex; align-items: center; gap: 20px;
  }
  .logo-row img { height: 240px; }
  .logo-row.has-logo .wordmark { display: none; }
  .logo-row .wordmark {
    font-size: 56px; font-weight: 800; letter-spacing: -0.035em;
  }
  .logo-row .wordmark .accent {
    background: var(--aw-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .headline {
    font-size: 82px; font-weight: 800; letter-spacing: -0.035em; text-align: center;
    max-width: 1400px; line-height: 1.08;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 22px 38px;
    background: var(--aw-gradient-primary);
    color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -0.01em;
    border-radius: var(--aw-radius-sm);
    box-shadow: 0 14px 40px rgba(56,108,218,0.45);
  }
  .cta .arrow { font-weight: 800; }
  .url { font-size: 22px; font-weight: 500; color: rgba(181,208,244,0.8); letter-spacing: 0.02em; }
</style></head>
<body>
<div class="stage enter" id="stage">
  <div class="bg"></div><div class="grid"></div>
  <div class="wrap">
    <div class="logo-row">
      <img id="logo" style="display:none"/>
      <div class="wordmark">AI<span class="accent">Waterside</span></div>
    </div>
    <div class="headline" id="headline"></div>
    <div class="cta" id="cta"><span id="cta-text"></span><span class="arrow">→</span></div>
    <div class="url" id="url"></div>
  </div>
</div>
<script>
  window.__READY__ = false;
  window.addEventListener('load', async () => {
    const P = window.__PROPS__ || {};
    const logoEl = document.getElementById('logo');
    if (P.logo_src) {
      const ok = await new Promise(res => {
        logoEl.onload = () => res(true);
        logoEl.onerror = () => res(false);
        logoEl.src = P.logo_src;
      });
      if (ok) {
        logoEl.style.display = '';
        document.querySelector('.logo-row').classList.add('has-logo');
        try { await logoEl.decode(); } catch(e) {}
      }
    } else {
      logoEl.style.display = 'none';
    }
    document.getElementById('headline').textContent = P.headline || 'Let\u2019s build your AI automation.';
    document.getElementById('cta-text').textContent = P.cta || 'Book a call';
    document.getElementById('url').textContent = P.url || 'yourdomain.com';
    await document.fonts.ready;
    window.__READY__ = true;
  });
</script>
</body></html>
