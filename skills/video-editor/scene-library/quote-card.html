<!doctype html>
<html><head><meta charset="utf-8"><title>quote-card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  .backdrop {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(56,108,218,0.22), transparent 60%),
                linear-gradient(135deg, rgba(10,20,40,0.92) 0%, rgba(10,20,40,0.82) 100%);
  }
  .quote-wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 120px;
  }
  .quote {
    max-width: 1400px; color: var(--aw-text-light);
    text-align: left;
  }
  .mark {
    font-size: 180px; line-height: 0.8; font-weight: 800;
    color: var(--aw-blue-mid); opacity: 0.65; margin-bottom: -40px;
  }
  .quote .body {
    font-size: 78px; font-weight: 700; line-height: 1.18;
    letter-spacing: -0.028em;
  }
  .quote .attr {
    margin-top: 36px; font-size: 26px; font-weight: 500;
    color: rgba(249,248,253,0.7); letter-spacing: 0.02em;
  }
  .quote .attr strong { color: var(--aw-blue-soft); font-weight: 700; }
  /* Layout B is the default (full-stage). Layout A shrinks to a side card. */
  .layout-A .backdrop { background: transparent; }
  .layout-A .quote-wrap { justify-content: flex-end; padding: 60px 80px; }
  .layout-A .quote { max-width: 640px; background: var(--aw-glass-dark); border: var(--aw-border-dark); border-radius: var(--aw-radius); padding: 40px 44px; backdrop-filter: blur(20px); }
  .layout-A .mark { font-size: 110px; margin-bottom: -18px; }
  .layout-A .quote .body { font-size: 42px; }
  .layout-A .quote .attr { font-size: 20px; margin-top: 20px; }
  .layout-A.side-left .quote-wrap { justify-content: flex-start; }
</style></head>
<body>
<div class="stage enter" id="stage">
  <div class="backdrop"></div>
  <div class="quote-wrap">
    <div class="quote">
      <div class="mark">"</div>
      <div class="body" id="body"></div>
      <div class="attr" id="attr"></div>
    </div>
  </div>
</div>
<script>
  window.__READY__ = false;
  window.addEventListener('load', async () => {
    const P = window.__PROPS__ || {};
    const stage = document.getElementById('stage');
    stage.classList.add('layout-' + (P.layout || 'B'));
    if ((P.layout || 'B') === 'A') stage.classList.add('side-' + (P.side || 'right'));
    document.getElementById('body').textContent = P.quote || '';
    const attr = P.attribution || '';
    document.getElementById('attr').innerHTML = attr ? ('— <strong>' + attr + '</strong>') : '';
    await document.fonts.ready;
    window.__READY__ = true;
  });
</script>
</body></html>
